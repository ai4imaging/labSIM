[project]
name = "amx"
version = "0.1.0"
description = "Articraft-MuJoCo wetlab pipeline: asset generation, robot-arm simulation with co-designed fixtures, and sim_judge-driven refinement."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "trimesh>=4.5",
    "manifold3d>=3.0",
    "rtree>=1.3",
    # Cross-sectioning a mesh into rings with holes. trimesh's `polygons_full`,
    # which is how the cavity volume and the wall thickness are measured, is a
    # hard import of shapely rather than a soft one.
    "shapely>=2.0",
    # Approximate convex decomposition. MuJoCo collides a mesh as its convex hull,
    # which turns every vessel into a solid billet and makes "can something be put
    # into it" unanswerable. Splitting the collision geometry into convex parts is
    # the only way those tests mean anything.
    "coacd>=1.0.5",
    "python-fcl>=0.7",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "networkx>=3.3",
    "pillow>=11.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
# Only needed to run part 1 (free-form asset authoring through the vendored Articraft SDK).
articraft = [
    "cadquery>=2.5",
    "aiofiles>=24.1",
    "websockets>=15.0",
    "socksio>=1.0",
    "bm25s>=0.3",
    "google-genai",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
amx = "amx.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amx", "vendor/sim_judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "slow: runs a simulated episode; a few seconds rather than a few milliseconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
